<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#060a12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0d77a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#a07818"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Compass ring -->
  <circle cx="16" cy="14" r="11" fill="none" stroke="#c9a227" stroke-width="0.5" opacity="0.5"/>

  <!-- Cardinal spikes -->
  <g fill="url(#gold)" opacity="0.9">
    <polygon points="16,3 15,7 16,1 17,7"/>
    <polygon points="16,25 15,21 16,27 17,21"/>
    <polygon points="5,14 9,13 3,14 9,15"/>
    <polygon points="27,14 23,13 29,14 23,15"/>
  </g>

  <!-- 8-pointed star center -->
  <g transform="translate(18.5, 11)" fill="url(#gold)">
    <polygon points="0,-4.5 0.6,-0.6 0,4.5 -0.6,-0.6"/>
    <polygon points="-4.5,0 -0.6,0.6 4.5,0 -0.6,-0.6"/>
    <polygon points="0,-4.5 3.2,-3.2 4.5,0 0.6,-0.6" opacity="0.65"/>
    <polygon points="4.5,0 3.2,3.2 0,4.5 0.6,0.6" opacity="0.65"/>
    <polygon points="0,4.5 -3.2,3.2 -4.5,0 -0.6,0.6" opacity="0.65"/>
    <polygon points="-4.5,0 -3.2,-3.2 0,-4.5 -0.6,-0.6" opacity="0.65"/>
    <circle r="1" fill="#f0d77a"/>
  </g>

  <!-- P letterform -->
  <g fill="url(#gold)">
    <!-- Stem -->
    <rect x="8.5" y="5" width="2.5" height="22"/>
    <!-- Top serif -->
    <rect x="7" y="5" width="8" height="1.5"/>
    <!-- Bottom serif -->
    <rect x="7" y="25.5" width="5" height="1.5"/>
    <!-- Bowl -->
    <path d="M11,5 L11,6.5 L15,6.5 Q20,6.5 20,11.5 Q20,16.5 15,16.5 L11,16.5 L11,18 L15.5,18 Q22.5,18 22.5,11.5 Q22.5,5 15.5,5 Z"/>
    <path d="M11,6.5 L15,6.5 Q19,6.5 19,11.5 Q19,16.5 15,16.5 L11,16.5 Z" fill="url(#bg)" opacity="0.7"/>
  </g>
</svg>
